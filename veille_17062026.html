const callGemini = async (prompt, signal, key) => {
  if (!key) throw new Error("Clé API manquante");
  const cleanKey = key.trim();
  const models = ["gemini-2.5-flash-lite", "gemini-2.5-flash"];
  const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }], system_instruction: { parts: [{ text: CONFIG.aiPromptRole }] } };
  
  for (let mIndex = 0; mIndex < models.length; mIndex++) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${models[mIndex]}:generateContent?key=${cleanKey}`;
    let retries = 3, delay = 1000;
    
    while (retries > 0) {
      try {
        if (signal?.aborted) throw new DOMException('Aborted', 'AbortError');
        const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal });
        
        if (!response.ok) {
          if (response.status === 404) break; // Le modèle n'existe pas, passe au fallback immédiatement
          let errorMsg = `Erreur API (HTTP ${response.status})`;
          try { const errObj = await response.json(); if (errObj?.error?.message) errorMsg += ` : ${errObj.error.message}`; } catch(e) {}
          throw new Error(errorMsg);
        }
        
        const data = await response.json();
        return data?.candidates?.[0]?.content?.parts?.[0]?.text || "Aucune réponse générée.";
      } catch (error) {
        if (error.name === 'AbortError') throw error;
        if (error.message.includes('API') && (error.message.includes('400') || error.message.includes('403'))) throw error;
        
        retries--;
        if (retries === 0 && mIndex === models.length - 1) throw error;
        if (retries === 0) break; // Passe au fallback après échec des requêtes
        
        await new Promise(res => setTimeout(res, delay));
        delay *= 2;
      }
    }
  }
};

const formatAiText = (text) => {
  if (!text) return null;
  const normalizedText = text.replace(/\\n/g, '\\n');
  return normalizedText.split('\\n').map((line, i) => {
    if (!line.trim()) return <br key={i} />;
    const parts = line.split(/(\*\*.*?\*\*)/g).map((part, j) => {
      if (part.startsWith('**') && part.endsWith('**')) return <strong key={j} className="text-white font-semibold">{part.slice(2, -2)}</strong>;
      return part;
    });
    return <p key={i} className="mb-2 leading-relaxed">{parts}</p>;
  });
};

export default function HubIA() {
  const [selectedArticle, setSelectedArticle] = useState(null);
  const [isLoaded, setIsLoaded] = useState(false);
  const [activeTab, setActiveTab] = useState('analyse');
  const [aiResponse, setAiResponse] = useState('');
  const [isAiLoading, setIsAiLoading] = useState(false);
  const [userQuery, setUserQuery] = useState('');
  const [copySuccess, setCopySuccess] = useState(false);
  const [userApiKey, setUserApiKey] = useState('');
  const abortControllerRef = useRef(null);

  useEffect(() => {
    setIsLoaded(true);
    setUserApiKey(localStorage.getItem('hubia_gemini_key') || '');
    return () => { if (abortControllerRef.current) abortControllerRef.current.abort(); };
  }, []);

  const getNewAbortSignal = () => {
    if (abortControllerRef.current) abortControllerRef.current.abort();
    abortControllerRef.current = new AbortController();
    return abortControllerRef.current.signal;
  };

  const openArticle = (article) => { setSelectedArticle(article); setActiveTab('analyse'); setAiResponse(''); setUserQuery(''); };
  
  const closeArticle = () => {
    if (abortControllerRef.current) abortControllerRef.current.abort();
    setSelectedArticle(null); setAiResponse(''); setUserQuery(''); setIsAiLoading(false);
  };

  const handleGenerateMemo = async () => {
    if (!selectedArticle) return;
    if (!userApiKey.trim()) { setAiResponse("Veuillez brancher votre propre clé API Gemini."); return; }
    setIsAiLoading(true); setAiResponse('');
    const signal = getNewAbortSignal();
    const context = selectedArticle?.summary?.context || "";
    const points = selectedArticle?.summary?.keyPoints?.join(' ') || "";
    const impacts = selectedArticle?.summary?.impacts?.join(' ') || "";
    const prompt = `${CONFIG.aiMemoPromptText} Sujet : "${selectedArticle.title}". Contexte : ${context} ${points}. Actions : ${impacts}.`;
    
    try { setAiResponse(await callGemini(prompt, signal, userApiKey)); }
    catch (err) { if (err.name !== 'AbortError') setAiResponse(err.message === "Clé API manquante" ? "Veuillez configurer votre clé API." : err.message); }
    finally { setIsAiLoading(false); }
  };

  const handleCustomQuery = async () => {
    if (!userQuery.trim() || !selectedArticle) return;
    if (!userApiKey.trim()) { setAiResponse("Veuillez brancher votre propre clé API Gemini."); return; }
    setIsAiLoading(true); setAiResponse('');
    const signal = getNewAbortSignal();
    const prompt = `Contexte : "${selectedArticle.title}" - ${selectedArticle?.summary?.context || ""}. Question : "${userQuery}". Réponds de manière précise et concise.`;
    
    try { setAiResponse(await callGemini(prompt, signal, userApiKey)); setUserQuery(''); }
    catch (err) { if (err.name !== 'AbortError') setAiResponse(err.message === "Clé API manquante" ? "Veuillez configurer votre clé API." : err.message); }
    finally { setIsAiLoading(false); }
  };

  const handleQueryKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleCustomQuery(); } };

  const copyToClipboard = async () => {
    if (!aiResponse) return;
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(aiResponse); }
      else { const el = document.createElement('textarea'); el.value = aiResponse; el.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(el); el.focus(); el.select(); document.execCommand('copy'); document.body.removeChild(el); }
      setCopySuccess(true); setTimeout(() => setCopySuccess(false), 2000);
    } catch {}
  };

  return (
    <div className="min-h-screen bg-slate-950 text-slate-200 font-sans overflow-x-hidden relative">
      <GlobalStyles />
      <div className="fixed top-0 left-1/4 w-96 h-96 rounded-full pointer-events-none bg-cyan-600/10 blur-[100px]" />
      <div className="fixed bottom-0 right-1/4 w-96 h-96 rounded-full pointer-events-none bg-violet-600/10 blur-[120px]" />
      
      <header className={`relative z-10 pt-20 pb-12 px-6 md:px-12 max-w-7xl mx-auto transition-all duration-1000 ${isLoaded ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-10'}`}>
        <div className="flex justify-between items-start mb-8">
            <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-slate-800/50 border border-slate-700">
              <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse" />
              <span className="text-sm font-medium text-slate-300 tracking-wide uppercase">{CONFIG.headerTag}</span>
            </div>
            {typeof LOGO_B64 !== 'undefined' && LOGO_B64 && (
               <div className="flex-shrink-0 ml-4 hidden md:block">
                 <img src={`data:image/png;base64,${LOGO_B64}`} alt="Logo ESEPAC" className="h-24 md:h-32 object-contain drop-shadow-xl bg-white/5 p-3 rounded-2xl border border-slate-700/50 backdrop-blur-sm" />
               </div>
            )}
        </div>
        <h1 className="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 leading-tight">
          {CONFIG.headerTitlePart1}<br />
          <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500">{CONFIG.headerTitlePart2}</span>
        </h1>
        <p className="text-lg md:text-xl text-slate-400 max-w-3xl leading-relaxed">{CONFIG.headerDescription}</p>
      </header>

      <main className="relative z-10 px-6 md:px-12 pb-16 max-w-7xl mx-auto">
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          {ARTICLES_DATA.map((article, index) => (
            <div key={article.id} onClick={() => openArticle(article)} className={`group cursor-pointer relative p-7 rounded-2xl bg-slate-900/60 border border-slate-800 hover:bg-slate-800/80 hover:border-cyan-500/50 flex flex-col shadow-xl transition-all duration-500 ${isLoaded ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-5'}`} style={{transitionDelay: `${index * 50}ms`}}>
              <div className="relative z-10 flex flex-col h-full">
                <div className="w-14 h-14 rounded-xl bg-slate-800/80 flex items-center justify-center border border-slate-700 mb-5 group-hover:scale-110 transition-transform duration-300">
                  {(() => {
                    const IconComponent = Lucide[article.iconComponent] || Lucide.Package;
                    return <IconComponent className={`w-6 h-6 ${article.iconColor}`} />;
                  })()}
                </div>
                <h3 className="text-xl font-bold text-white mb-3 leading-snug group-hover:text-cyan-300 transition-colors">{article.title}</h3>
                <p className="text-slate-400 text-sm flex-grow leading-relaxed">&quot;{article.catchphrase}&quot;</p>
                <div className="mt-6 flex items-center justify-between text-xs font-bold text-cyan-400 uppercase tracking-wider">
                  <span className="flex items-center group-hover:translate-x-2 transition-transform duration-300">Dossier <ChevronRight className="w-4 h-4 ml-1" /></span>
                  <span className="text-slate-600 font-medium normal-case">{article.sourceName}</span>
                </div>
              </div>
            </div>
          ))}
        </div>
      </main>

      <section className={`relative z-10 px-6 md:px-12 pb-24 max-w-7xl mx-auto transition-all duration-1000 delay-700 ${isLoaded ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`}>
        <div className="p-8 md:p-10 rounded-3xl bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 shadow-2xl relative overflow-hidden">
          <div className="absolute top-0 right-0 w-64 h-64 rounded-full pointer-events-none bg-cyan-600/5 blur-[80px]" />
          <h2 className="text-2xl md:text-3xl font-extrabold text-white mb-8 flex items-center"><Target className="w-8 h-8 mr-4 text-cyan-400" />{CONFIG.actionPlanTitle}</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-5 relative z-10">
            {CONFIG.actionPlanItems.map((action, idx) => (
              <div key={idx} className="flex items-start space-x-4 bg-slate-800/40 p-5 rounded-xl border border-slate-700/50 hover:bg-slate-800/60 transition-colors">
                <CheckCircle2 className="w-6 h-6 text-emerald-400 flex-shrink-0 mt-0.5" />
                <p className="text-slate-300 text-sm md:text-base leading-relaxed font-medium">{action}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      {selectedArticle && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
          <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-md transition-opacity" onClick={closeArticle} />
          <div className="relative w-full max-w-3xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh] animate-modal">
            <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500" />
            <div className="p-6 md:p-8 border-b border-slate-800 bg-slate-900/50 sticky top-0 z-10 backdrop-blur-sm">
              <button onClick={closeArticle} className="absolute top-6 right-6 p-2 rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-colors"><X className="w-5 h-5" /></button>
              <div className="flex items-center space-x-4 mb-4">
                <div className="p-3 rounded-xl bg-slate-800 border border-slate-700 flex-shrink-0">
                  {(() => {
                    const SelectedIcon = Lucide[selectedArticle.iconComponent] || Lucide.Package;
                    return <SelectedIcon className={`w-6 h-6 ${selectedArticle.iconColor}`} />;
                  })()}
                </div>
                <h2 className="text-2xl md:text-3xl font-bold text-white leading-tight pr-10">{selectedArticle.title}</h2>
              </div>
              <div className="flex flex-wrap items-center gap-3 mt-4">
                <a href={selectedArticle.url} target="_blank" rel="noopener noreferrer" className="inline-flex items-center text-sm font-semibold text-slate-900 bg-cyan-400 hover:bg-cyan-300 px-4 py-2 rounded-lg transition-colors">
                  Source : {selectedArticle.sourceName}<ExternalLink className="w-4 h-4 ml-2" />
                </a>
                <div className="flex bg-slate-800 rounded-lg p-1 border border-slate-700 ml-auto mr-auto md:ml-4">
                  <button onClick={() => setActiveTab('analyse')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${activeTab==='analyse'?'bg-slate-700 text-white shadow':'text-slate-400 hover:text-slate-200'}`}>{CONFIG.tabAnalysisLabel}</button>
                  <button onClick={() => setActiveTab('ia')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors flex items-center ${activeTab==='ia'?'bg-cyan-900/40 text-cyan-300 shadow border border-cyan-800/50':'text-slate-400 hover:text-cyan-400'}`}><Sparkles className="w-4 h-4 mr-1.5" />{CONFIG.tabAiLabel}</button>
                </div>
              </div>
            </div>
            <div className="p-6 md:p-8 overflow-y-auto custom-scrollbar flex-1 text-slate-300">
              {activeTab === 'analyse' ? (
                <div>
                  <div className="mb-8">
                    <h4 className="flex items-center text-sm font-bold text-cyan-400 uppercase tracking-widest mb-3"><Info className="w-4 h-4 mr-2" />Le Contexte</h4>
                    <p className="text-lg leading-relaxed text-slate-200 italic border-l-2 border-cyan-800 pl-4 bg-slate-800/20 py-2 rounded-r-lg">{selectedArticle?.summary?.context}</p>
                  </div>
                  <div className="mb-8">
                    <h4 className="flex items-center text-sm font-bold text-purple-400 uppercase tracking-widest mb-4"><Zap className="w-4 h-4 mr-2" />Les Faits Marquants</h4>
                    <ul className="space-y-3">{selectedArticle?.summary?.keyPoints?.map((point, i) => (<li key={i} className="flex items-start"><span className="text-purple-500 mr-3 mt-1.5 text-xs">■</span><span className="leading-relaxed">{point}</span></li>))}</ul>
                  </div>
                  <div className="mb-4 bg-slate-800/40 p-6 rounded-xl border border-slate-700">
                    <h4 className="flex items-center text-sm font-bold text-emerald-400 uppercase tracking-widest mb-4"><Target className="w-4 h-4 mr-2" />{CONFIG.impactSectionTitle}</h4>
                    <ul className="space-y-4">{selectedArticle?.summary?.impacts?.map((point, i) => (<li key={i} className="flex items-start"><CheckCircle2 className="w-5 h-5 text-emerald-500 mr-3 flex-shrink-0 mt-0.5" /><span className="font-medium text-slate-200 leading-relaxed">{point}</span></li>))}</ul>
                  </div>
                </div>
              ) : (
                <div className="flex flex-col h-full space-y-6">
                  <div className="bg-cyan-950/20 border border-cyan-900/50 rounded-xl p-5 mb-2">
                    <label className="text-cyan-400 font-semibold mb-2 block text-sm"><Sparkles className="w-4 h-4 inline mr-2" />Votre clé API Gemini (sauvegarde locale)</label>
                    <input type="password" value={userApiKey} onChange={(e) => { setUserApiKey(e.target.value); localStorage.setItem('hubia_gemini_key', e.target.value); }} onFocus={(e) => e.target.type = 'text'} onBlur={(e) => e.target.type = 'password'} placeholder="Commence par AIzaSy..." className="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 pl-3 pr-3 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 text-sm font-mono" />
                  </div>
                  <div className="bg-cyan-950/20 border border-cyan-900/50 rounded-xl p-5">
                    <h4 className="text-cyan-400 font-semibold mb-2 flex items-center"><Sparkles className="w-5 h-5 mr-2" />Que souhaitez-vous faire avec cet article ?</h4>
                    <p className="text-sm text-slate-400 mb-4">L&apos;IA analyse le contexte pour générer des documents de travail ou répondre à vos interrogations.</p>
                    <button onClick={handleGenerateMemo} disabled={isAiLoading} className="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-white font-medium flex items-center justify-center transition-colors disabled:opacity-50">
                      {isAiLoading && !userQuery ? <Loader2 className="w-5 h-5 mr-2 animate-spin text-cyan-400" /> : <MessageSquare className="w-5 h-5 mr-2 text-cyan-400" />}
                      ✨ Rédiger un mémo interne de synthèse
                    </button>
                  </div>
                  <div className="relative">
                    <input type="text" value={userQuery} onChange={(e) => setUserQuery(e.target.value)} onKeyDown={handleQueryKeyDown} placeholder="Posez une question sur cet article..." disabled={isAiLoading} className="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-4 pr-12 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500" />
                    <button onClick={handleCustomQuery} disabled={isAiLoading || !userQuery.trim()} className="absolute right-2 top-2 p-1.5 bg-cyan-600 hover:bg-cyan-500 rounded-lg text-white disabled:opacity-50 transition-colors">
                      {isAiLoading && userQuery ? <Loader2 className="w-4 h-4 animate-spin" /> : <Send className="w-4 h-4" />}
                    </button>
                  </div>
                  {aiResponse && (
                    <div className="mt-4 bg-slate-800/60 border border-slate-700 rounded-xl p-5 relative">
                      <button onClick={copyToClipboard} className="absolute top-4 right-4 p-1.5 text-slate-400 hover:text-white bg-slate-700/50 hover:bg-slate-600 rounded-md transition-colors" title="Copier">
                        {copySuccess ? <CheckCircle2 className="w-4 h-4 text-emerald-400" /> : <Copy className="w-4 h-4" />}
                      </button>
                      <div className="flex items-center mb-3"><Sparkles className="w-5 h-5 text-cyan-400 mr-2" /><span className="font-semibold text-white">Réponse de l&apos;expert IA</span></div>
                      <div className="text-slate-300 text-sm mt-2">{formatAiText(aiResponse)}</div>
                    </div>
                  )}
                </div>
              )}
            </div>
            <div className="p-6 border-t border-slate-800 bg-slate-900 flex justify-end">
              <button onClick={closeArticle} className="px-6 py-2.5 rounded-xl border border-slate-600 text-slate-300 font-semibold hover:bg-slate-800 hover:text-white transition-colors">Fermer</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

        /* INJECTION AUTOMATIQUE POUR RENDRE LE COMPOSANT SUR PAGE STATIQUE */
        const root = createRoot(document.getElementById('root'));
        root.render(<HubIA />);
    </script>
</body>
</html>
